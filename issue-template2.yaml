name: 🚀 New Release Deployment
description: Create a new release to deploy to staging and production environments.
title: "🚀 Release: [RELEASE_NUMBER]"
labels: ["deployment"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will track the deployment of a new release to the staging and production environments.
        **Please fill out the release number (Docker tag) below.**
  - type: input
    id: release_number
    attributes:
      label: Release Number (Docker Tag)
      description: "Specify the Docker tag of the image to be deployed (e.g., v1.2.3)."
      placeholder: "v1.2.3"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ### Deployment Checklist
        - [ ] Release to Stage
        - [ ] Release to Prod
