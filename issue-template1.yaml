name: Deployment Request
description: Request a deployment to stage or prod
title: "Deployment Request"
labels: ["deployment"]
body:
  - type: input
    id: release_number
    attributes:
      label: Release Number
      description: Please provide the Docker tag to be deployed.
      placeholder: e.g., v1.2.3
    validations:
      required: true
  - type: input
    id: change_ticket
    attributes:
      label: Change Ticket Number (Optional)
      description: If known, provide the change ticket number (e.g., ABC-123). You can also add it later via a label or comment for prod deployments.
      placeholder: e.g., ABC-123
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Deployment Instructions

        - **Stage Deployment**: Comment "Release to Stage" to deploy to the staging environment.
        - **Prod Deployment**: If you are in the `code_admin` group, comment "Release to Prod". Provide the change ticket in one of these ways:
          1. In the "Change Ticket Number" field above when creating this issue.
          2. Add a label like `change-ticket-ABC-123`.
          3. Post a comment like "Change ticket: ABC-123" before or after "Release to Prod".
          Alternatively, comment "Release to Prod, change ticket: ABC-123" to provide it directly.
        - **Notes**: 
          - Stage must be deployed before prod.
          - Prod deployments require a valid change ticket (validated via ServiceNow) and approval from a `code_admin` member.
          - Do not create sub-issues for deployment requests.
          - When the deployment is complete, close this issue with a comment indicating the outcome (e.g., "Deployment to prod completed successfully").
